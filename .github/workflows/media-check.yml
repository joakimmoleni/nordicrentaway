name: Inspect approved website media
on:
  push:
    branches: [main]
    paths: ['.github/workflows/media-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Retrieve existing company photographs
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, concurrent.futures
          root = pathlib.Path('approved-media')
          root.mkdir()
          sources = {
            'seacoast.jpg': 'https://www.nordicrentaway.com/pictures/dsc_0539.jpg?v20190624221613=',
            'valdes.jpg': 'https://www.nordicrentaway.com/pictures/vald.jpg?v20210322081355=',
            'jazmin.jpg': 'https://www.nordicrentaway.com/pictures/dsc_02782.jpg?v20190624225726=',
            'altea-interior.jpg': 'https://www.nordicrentaway.com/pictures/altea-house.jpg?v20240121162927=',
            'team.jpg': 'https://www.nordicrentaway.com/pictures/teamnr.jpg?v20190727130441',
            'logo.png': 'https://www.nordicrentaway.com/pictures/nav_thumbs/NORDIC-logo-WEBPAGE.png?v20180113205528',
            'home.html': 'https://www.nordicrentaway.com/',
            'properties.html': 'https://www.nordicrentaway.com/properties',
            'contact.html': 'https://www.nordicrentaway.com/contact'
          }
          def fetch(item):
            name, url = item
            try:
              req = urllib.request.Request(url, headers={'User-Agent': 'NordicRentAway-Preview/1.0'})
              with urllib.request.urlopen(req, timeout=45) as response:
                data = response.read(16000000)
                kind = response.headers.get('Content-Type', '')
                if name.endswith(('.jpg', '.png')) and not kind.startswith('image/'):
                  raise ValueError('Expected an image, received ' + kind)
                (root / name).write_bytes(data)
                return {'file': name, 'url': url, 'status': response.status, 'bytes': len(data), 'type': kind}
            except Exception as error:
              return {'file': name, 'url': url, 'error': str(error)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
            report = list(pool.map(fetch, sources.items()))
          (root / 'report.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
          command -v convert || true
          command -v identify || true
      - name: Save inspection files
        uses: actions/upload-artifact@v4
        with:
          name: approved-media-inspection
          path: approved-media/
          retention-days: 3
